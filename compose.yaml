services:
  floci:
    image: floci/floci:latest
    user: root
    ports:
      - "4566:4566"
    environment:
      FLOCI_HOSTNAME: floci
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - floci
